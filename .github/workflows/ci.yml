name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet --version
      - run: dotnet restore ServiceStats.slnx
      - run: dotnet build ServiceStats.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/ServiceStats.Tests/ServiceStats.Tests.csproj --configuration Release --no-build
      - run: dotnet pack src/ServiceStats/ServiceStats.csproj --configuration Release --no-build
